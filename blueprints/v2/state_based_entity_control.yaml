blueprint:
  name: State Based Entity Control v2
  description: >-
    Coordinate one or more target entities from matching trigger states, with
    configurable actions, light gates, blockers, time windows, and diagnostics.
  domain: automation
  homeassistant:
    min_version: 2026.7.0
  input:
    core:
      name: Core entities and timeout
      icon: mdi:link-variant
      input:
        trigger_entities:
          name: Trigger entities
          description: Entities whose state changes evaluate this automation.
          selector:
            entity:
              multiple: true
        target_entities:
          name: Target entities
          description: Entities controlled by the configured actions.
          selector:
            entity:
              multiple: true
        off_target_entities:
          name: Off target entities
          description: Optional alternate entities used by deactivation actions.
          default: []
          selector:
            entity:
              multiple: true
        main_timeout:
          name: Main timeout
          description: Delay before deactivation after triggers stop matching.
          default:
            hours: 0
            minutes: 0
            seconds: 30
          selector:
            duration: {}

    state_matching:
      name: State matching
      icon: mdi:regex
      collapsed: true
      input:
        activation_state_pattern:
          name: Activation state pattern
          description: Regular expression matching states that activate targets.
          default: "on"
          selector:
            text: {}
        deactivation_state_pattern:
          name: Deactivation state pattern
          description: Optional regular expression for explicit deactivation states.
          default: ""
          selector:
            text: {}
        target_state_tracking:
          name: Track target state
          description: Re-evaluate when a target moves away from its desired state.
          default: true
          selector:
            boolean: {}
        target_state_pattern:
          name: Target state pattern
          description: Regular expression describing the desired target state.
          default: "on"
          selector:
            text: {}

    actions_config:
      name: Actions
      icon: mdi:play-box-multiple-outline
      collapsed: true
      input:
        activation_actions:
          name: Activation actions
          description: Actions run when the activation criteria are met.
          default: []
          selector:
            action: {}
        deactivation_actions:
          name: Deactivation actions
          description: Actions run when targets should be deactivated.
          default: []
          selector:
            action: {}

    light_conditions:
      name: Light conditions
      icon: mdi:theme-light-dark
      collapsed: true
      input:
        illuminance_enabled:
          name: Enable illuminance gate
          default: false
          selector:
            boolean: {}
        illuminance_sensor:
          name: Illuminance sensor
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: illuminance
        illuminance_threshold:
          name: Illuminance threshold
          description: Activation is allowed below this light level.
          default: 100
          selector:
            number:
              min: 0
              max: 100000
              unit_of_measurement: lx
              mode: box
        sun_enabled:
          name: Enable sun elevation gate
          default: false
          selector:
            boolean: {}
        sun_elevation_threshold:
          name: Sun elevation threshold
          description: Activation is allowed below this solar elevation.
          default: 0
          selector:
            number:
              min: -90
              max: 90
              unit_of_measurement: "°"
        light_gate_mode:
          name: Light gate mode
          description: Require any enabled light gate or all enabled light gates.
          default: any
          selector:
            select:
              mode: dropdown
              options:
                - any
                - all

    blocking:
      name: Blocking
      icon: mdi:block-helper
      collapsed: true
      input:
        activation_blocker_entity:
          name: Activation blocker entity
          description: Optional entity that can prevent activation.
          default: ""
          selector:
            entity: {}
        activation_blocker_state_pattern:
          name: Activation blocker state pattern
          description: Regular expression for states that block activation.
          default: "on"
          selector:
            text: {}
        deactivation_blocker_entity:
          name: Deactivation blocker entity
          description: Optional entity that can prevent deactivation.
          default: ""
          selector:
            entity: {}
        deactivation_blocker_state_pattern:
          name: Deactivation blocker state pattern
          description: Regular expression for states that block deactivation.
          default: "on"
          selector:
            text: {}

    manual_off:
      name: Manual off handling
      icon: mdi:hand-back-right-off-outline
      collapsed: true
      input:
        manual_off_enabled:
          name: Enable manual off handling
          default: false
          selector:
            boolean: {}
        manual_off_duration:
          name: Manual off duration
          description: Time to suppress reactivation after a manual off state.
          default:
            hours: 0
            minutes: 30
            seconds: 0
          selector:
            duration: {}
        manual_off_state_pattern:
          name: Manual off state pattern
          description: Regular expression identifying a manually switched-off target.
          default: "off"
          selector:
            text: {}

    execution_windows:
      name: Execution windows
      icon: mdi:calendar-clock
      collapsed: true
      input:
        execution_schedule:
          name: Execution schedule
          description: Optional schedule entity that limits when actions may run.
          default: ""
          selector:
            entity:
              filter:
                - domain: schedule
        execution_window_1_enabled:
          name: Enable daily window 1
          default: false
          selector:
            boolean: {}
        execution_window_1_start:
          name: Daily window 1 start
          default: "00:00:00"
          selector:
            time: {}
        execution_window_1_end:
          name: Daily window 1 end
          default: "00:00:00"
          selector:
            time: {}
        execution_window_2_enabled:
          name: Enable daily window 2
          default: false
          selector:
            boolean: {}
        execution_window_2_start:
          name: Daily window 2 start
          default: "00:00:00"
          selector:
            time: {}
        execution_window_2_end:
          name: Daily window 2 end
          default: "00:00:00"
          selector:
            time: {}
        execution_window_3_enabled:
          name: Enable daily window 3
          default: false
          selector:
            boolean: {}
        execution_window_3_start:
          name: Daily window 3 start
          default: "00:00:00"
          selector:
            time: {}
        execution_window_3_end:
          name: Daily window 3 end
          default: "00:00:00"
          selector:
            time: {}

    alternate_timeouts:
      name: Alternate timeouts
      icon: mdi:timer-cog-outline
      collapsed: true
      input:
        alternate_timeout_1_enabled:
          name: Enable alternate timeout 1
          default: false
          selector:
            boolean: {}
        alternate_timeout_1_start:
          name: Alternate timeout 1 start
          default: "00:00:00"
          selector:
            time: {}
        alternate_timeout_1_end:
          name: Alternate timeout 1 end
          default: "00:00:00"
          selector:
            time: {}
        alternate_timeout_1_duration:
          name: Alternate timeout 1 duration
          default:
            hours: 0
            minutes: 0
            seconds: 30
          selector:
            duration: {}
        alternate_timeout_2_enabled:
          name: Enable alternate timeout 2
          default: false
          selector:
            boolean: {}
        alternate_timeout_2_start:
          name: Alternate timeout 2 start
          default: "00:00:00"
          selector:
            time: {}
        alternate_timeout_2_end:
          name: Alternate timeout 2 end
          default: "00:00:00"
          selector:
            time: {}
        alternate_timeout_2_duration:
          name: Alternate timeout 2 duration
          default:
            hours: 0
            minutes: 0
            seconds: 30
          selector:
            duration: {}
        alternate_timeout_3_enabled:
          name: Enable alternate timeout 3
          default: false
          selector:
            boolean: {}
        alternate_timeout_3_start:
          name: Alternate timeout 3 start
          default: "00:00:00"
          selector:
            time: {}
        alternate_timeout_3_end:
          name: Alternate timeout 3 end
          default: "00:00:00"
          selector:
            time: {}
        alternate_timeout_3_duration:
          name: Alternate timeout 3 duration
          default:
            hours: 0
            minutes: 0
            seconds: 30
          selector:
            duration: {}

    advanced:
      name: Advanced ranges
      icon: mdi:code-braces
      description: >-
        Execution ranges use one start-end range per line. Alternate timeouts
        use start-end,duration per line. Times use HH:MM:SS; ranges may cross
        midnight.
      collapsed: true
      input:
        advanced_execution_ranges:
          name: Advanced execution ranges
          description: Optional execution ranges in start-end format, one per line.
          default: ""
          selector:
            text:
              multiline: true
        advanced_alternate_timeouts:
          name: Advanced alternate timeouts
          description: Optional start-end,duration entries, one per line.
          default: ""
          selector:
            text:
              multiline: true

    diagnostics:
      name: Diagnostics
      icon: mdi:text-box-search-outline
      collapsed: true
      input:
        logbook_enabled:
          name: Enable logbook diagnostics
          description: Record blueprint decisions in the Home Assistant logbook.
          default: true
          selector:
            boolean: {}

mode: restart
max_exceeded: silent

variables:
  trigger_entities: !input trigger_entities
  target_entities: !input target_entities
  configured_off_target_entities: !input off_target_entities
  activation_state_pattern: !input activation_state_pattern
  deactivation_state_pattern: !input deactivation_state_pattern
  target_state_pattern: !input target_state_pattern
  target_state_tracking: !input target_state_tracking
  illuminance_enabled: !input illuminance_enabled
  illuminance_sensor: !input illuminance_sensor
  illuminance_threshold: !input illuminance_threshold
  sun_enabled: !input sun_enabled
  sun_elevation_threshold: !input sun_elevation_threshold
  light_gate_mode: !input light_gate_mode
  activation_blocker_entity: !input activation_blocker_entity
  activation_blocker_state_pattern: !input activation_blocker_state_pattern
  deactivation_blocker_entity: !input deactivation_blocker_entity
  deactivation_blocker_state_pattern: !input deactivation_blocker_state_pattern
  manual_off_enabled: !input manual_off_enabled
  manual_off_duration: !input manual_off_duration
  manual_off_state_pattern: !input manual_off_state_pattern

  off_target_entities: >-
    {{ configured_off_target_entities
       if configured_off_target_entities | count > 0
       else target_entities }}

  available_trigger_entities: >-
    {%- set ns = namespace(entities=[]) -%}
    {%- for entity_id in trigger_entities -%}
      {%- if states(entity_id) not in ['unknown', 'unavailable'] -%}
        {%- set ns.entities = ns.entities + [entity_id] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.entities }}

  activation_entities: >-
    {%- set ns = namespace(entities=[]) -%}
    {%- for entity_id in available_trigger_entities -%}
      {%- if states(entity_id) is match('^(' ~ activation_state_pattern ~ ')$', ignorecase=true) -%}
        {%- set ns.entities = ns.entities + [entity_id] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.entities }}

  deactivation_entities: >-
    {%- set ns = namespace(entities=[]) -%}
    {%- if deactivation_state_pattern | trim != '' -%}
      {%- for entity_id in available_trigger_entities -%}
        {%- if states(entity_id) is match('^(' ~ deactivation_state_pattern ~ ')$', ignorecase=true) -%}
          {%- set ns.entities = ns.entities + [entity_id] -%}
        {%- endif -%}
      {%- endfor -%}
    {%- elif activation_entities | count == 0 -%}
      {%- set ns.entities = available_trigger_entities -%}
    {%- endif -%}
    {{ ns.entities }}

  active_target_entities: >-
    {%- set ns = namespace(entities=[]) -%}
    {%- for entity_id in target_entities -%}
      {%- if states(entity_id) is match('^(' ~ target_state_pattern ~ ')$', ignorecase=true) -%}
        {%- set ns.entities = ns.entities + [entity_id] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.entities }}

  effective_target_state_tracking: >-
    {%- set ns = namespace(has_stateless_target=false) -%}
    {%- for entity_id in target_entities -%}
      {%- if entity_id.split('.', 1)[0] in ['scene', 'script'] -%}
        {%- set ns.has_stateless_target = true -%}
      {%- endif -%}
    {%- endfor -%}
    {{ target_state_tracking and not ns.has_stateless_target }}

  trigger_source_allows_activation: >-
    {{ trigger is not defined or trigger.id != 'target_state_stable' }}

  illuminance_gate_passed: >-
    {%- if not illuminance_enabled -%}
      {{ true }}
    {%- else -%}
      {%- set illuminance_state = states(illuminance_sensor) if illuminance_sensor | trim != '' else none -%}
      {{ illuminance_state is not none
         and illuminance_state not in ['unknown', 'unavailable']
         and is_number(illuminance_state)
         and illuminance_state | float <= illuminance_threshold | float }}
    {%- endif -%}

  sun_gate_passed: >-
    {%- if not sun_enabled -%}
      {{ true }}
    {%- else -%}
      {%- set elevation = state_attr('sun.sun', 'elevation') -%}
      {{ elevation is not none
         and is_number(elevation)
         and elevation | float <= sun_elevation_threshold | float }}
    {%- endif -%}

  light_gates_passed: >-
    {%- if illuminance_enabled and sun_enabled -%}
      {{ (illuminance_gate_passed or sun_gate_passed)
         if light_gate_mode == 'any'
         else (illuminance_gate_passed and sun_gate_passed) }}
    {%- elif illuminance_enabled -%}
      {{ illuminance_gate_passed }}
    {%- elif sun_enabled -%}
      {{ sun_gate_passed }}
    {%- else -%}
      {{ true }}
    {%- endif -%}

  activation_blocked: >-
    {{ activation_blocker_entity | trim != ''
       and activation_blocker_state_pattern | trim != ''
       and states(activation_blocker_entity) is match('^(' ~ activation_blocker_state_pattern ~ ')$', ignorecase=true) }}

  deactivation_blocked: >-
    {{ deactivation_blocker_entity | trim != ''
       and deactivation_blocker_state_pattern | trim != ''
       and states(deactivation_blocker_entity) is match('^(' ~ deactivation_blocker_state_pattern ~ ')$', ignorecase=true) }}

  manual_off_duration_seconds: >-
    {{ (manual_off_duration.get('days', 0) | int(0) * 86400)
       + (manual_off_duration.get('hours', 0) | int(0) * 3600)
       + (manual_off_duration.get('minutes', 0) | int(0) * 60)
       + (manual_off_duration.get('seconds', 0) | int(0)) }}

  manual_off_lockout_active: >-
    {%- set ns = namespace(active=false) -%}
    {%- if manual_off_enabled
          and manual_off_duration_seconds | float > 0
          and manual_off_state_pattern | trim != '' -%}
      {%- set current_timestamp = as_timestamp(now()) -%}
      {%- for entity_id in target_entities -%}
        {%- set state_object = states[entity_id] -%}
        {%- if state_object is not none
              and states(entity_id) is match('^(' ~ manual_off_state_pattern ~ ')$', ignorecase=true) -%}
          {%- set changed_timestamp = as_timestamp(state_object.last_changed, none) -%}
          {%- if changed_timestamp is not none -%}
            {%- set age = current_timestamp - changed_timestamp -%}
            {%- if age >= 0 and age < manual_off_duration_seconds | float -%}
              {%- set ns.active = true -%}
            {%- endif -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endif -%}
    {{ ns.active }}

triggers:
  - trigger: event
    event_type: automation_reloaded
    id: automation_reloaded
  - trigger: homeassistant
    event: start
    id: home_assistant_started
  - trigger: state
    entity_id: !input trigger_entities
    id: trigger_entity_changed
  - trigger: state
    entity_id: !input target_entities
    for:
      seconds: 3
    id: target_state_stable
  - trigger: state
    entity_id: !input target_entities
    for: !input manual_off_duration
    id: manual_lockout_expired

conditions:
  - alias: Require at least one available trigger entity
    condition: template
    value_template: "{{ available_trigger_entities | count > 0 }}"

actions: []
